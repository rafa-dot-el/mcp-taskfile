version: "3"

silent: true

env:
  # Pure-Go build (static binary, no C compiler). Matches package.nix.
  CGO_ENABLED: "0"

vars:
  # Single version source, shared with package.nix.
  VERSION:
    sh: cat VERSION
  COVER_PROFILE: coverage.out
  CACHIX_CACHE: rafa-dot-el
  CACHIX_PASS_ENTRY: code/cachix/tokens-main-ci
  # Minimum total statement coverage (%). Ratchet upward; never lower.
  COVER_MIN: "78"
  # Pure functions (no I/O): each must reach COVER_PURE_MIN on its own.
  COVER_PURE_MIN: "95"
  PURE_FUNCS: >-
    combineOutput parseLogLevel renderLogLevel sanitizeToolName dedupeToolNames
    tasksChanged normalizedTaskInfo taskInfoEqual normalizeTaskfilePath
    shouldReloadForEvent isRootTaskfileName

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list

  fmt:
    desc: Format Go and Nix sources
    cmds:
      - gofmt -w .
      - nixfmt flake.nix package.nix devenv.nix

  build:
    desc: Build the binary with the version injected (ldflags)
    cmds:
      # Same flags as package.nix: stripped, no build-machine paths.
      - go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o mcp-taskfile .
      - echo "[+] built mcp-taskfile {{.VERSION}}"

  test:
    desc: Run tests
    cmds:
      - go test -count=1 ./...

  test:cover:
    desc: Run tests with coverage; enforce the total minimum and the per-function minimum on pure functions
    cmds:
      - go test -count=1 -coverprofile={{.COVER_PROFILE}} ./...
      - |
        total="$(go tool cover -func={{.COVER_PROFILE}} | awk '/^total:/ {sub("%","",$3); print $3}')"
        echo "[*] total coverage: ${total}% (minimum {{.COVER_MIN}}%)"
        awk -v t="$total" -v m="{{.COVER_MIN}}" 'BEGIN { exit !(t+0 >= m+0) }' || { echo "[-] coverage below minimum"; exit 1; }
        go tool cover -func={{.COVER_PROFILE}} | awk -v want="{{.PURE_FUNCS}}" -v min="{{.COVER_PURE_MIN}}" '
          BEGIN { n = split(want, w, " "); for (i = 1; i <= n; i++) need[w[i]] = 1 }
          ($2 in need) { pct = $3; sub("%", "", pct); seen[$2] = 1
            if (pct + 0 < min + 0) { printf "[-] %s %s%% < %s%%\n", $2, pct, min; bad = 1 } }
          END { for (f in need) if (!(f in seen)) { printf "[-] pure function %s not found\n", f; bad = 1 }
                if (bad) exit 1 }'
        echo "[+] coverage gate passed (pure functions >= {{.COVER_PURE_MIN}}%)"

  lint:
    desc: Run golangci-lint (includes gosec), gofmt check, statix, deadnix, actionlint, shellcheck
    cmds:
      - golangci-lint run ./...
      - test -z "$(gofmt -l .)" || { echo "[-] gofmt needed:"; gofmt -l .; exit 1; }
      - statix check .
      - deadnix --fail .
      - actionlint
      - shellcheck .envrc

  sec:vuln:
    desc: govulncheck on reachable Go vulnerabilities
    cmds:
      - govulncheck ./...

  sec:secrets:
    desc: gitleaks scan of the working tree and git history
    cmds:
      - gitleaks detect --redact --no-banner

  sec:deps:
    desc: osv-scanner over go.mod
    cmds:
      - osv-scanner scan source --lockfile=go.mod

  sec:
    desc: All security scans (vuln, secrets, deps)
    cmds:
      - task: sec:vuln
      - task: sec:secrets
      - task: sec:deps

  check:
    desc: Nix flake check (pure; builds the package and runs its tests in the sandbox)
    cmds:
      - nix flake check

  check:release:
    desc: Fail unless TAG (e.g. v0.1.0) equals v + the VERSION file; CI runs it on every tag
    requires:
      vars: [TAG]
    cmds:
      - |
        [ "{{.TAG}}" = "v{{.VERSION}}" ] || { echo "[-] tag {{.TAG}} does not match VERSION {{.VERSION}} (want v{{.VERSION}})"; exit 1; }
        echo "[+] tag {{.TAG}} matches VERSION"

  check:pins:
    desc: Fail if the dev shell (devenv) and the package (flake.lock) use different nixpkgs revisions
    cmds:
      - |
        flake_rev="$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)"
        devenv_rev="$(jq -r '.nodes.nixpkgs.locked.rev' devenv.lock)"
        grep -q "github:NixOS/nixpkgs/$flake_rev\$" devenv.yaml || { echo "[-] devenv.yaml does not pin nixpkgs $flake_rev (flake.lock)"; exit 1; }
        [ "$flake_rev" = "$devenv_rev" ] || { echo "[-] devenv.lock nixpkgs $devenv_rev != flake.lock nixpkgs $flake_rev"; exit 1; }
        echo "[+] dev shell and package share nixpkgs $flake_rev"

  update:
    desc: Update flake inputs and Go modules (patch level only; minor/major bumps are deliberate), then re-run the gate
    cmds:
      - nix flake update
      # devenv.yaml pins the exact nixpkgs revision of flake.lock (check:pins).
      - |
        rev="$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)"
        sed -i "s|github:NixOS/nixpkgs/[0-9a-f]\{40\}|github:NixOS/nixpkgs/$rev|" devenv.yaml
      - devenv update
      - task: check:pins
      - go get -u=patch ./...
      - go mod tidy
      - echo "[*] If go.mod/go.sum changed, set a fake vendorHash in package.nix, run 'task check', and paste the reported hash."

  ci:
    desc: Full gate used by CI (lint, tests with coverage, security scans, nix check, pins)
    cmds:
      - task: lint
      - task: test:cover
      - task: sec
      - task: check
      - task: check:pins

  build:nix:
    desc: Build the package with this flake (pinned Go) and print its store path
    cmds:
      - nix build --no-link --print-out-paths .#default

  cache:push:
    desc: >-
      Build the package with this flake and push its closure to the rafa-dot-el
      Cachix cache (PUBLIC). Same command locally and in CI. Token:
      CACHIX_AUTH_TOKEN (CI) or pass (local); never written to disk.
    cmds:
      - |
        [ -n "${CACHIX_AUTH_TOKEN:-}" ] || CACHIX_AUTH_TOKEN="$(pass show {{.CACHIX_PASS_ENTRY}} | head -n1)"
        [ -n "$CACHIX_AUTH_TOKEN" ] || { echo "[-] no Cachix token: set CACHIX_AUTH_TOKEN or add pass entry {{.CACHIX_PASS_ENTRY}}"; exit 1; }
        export CACHIX_AUTH_TOKEN
        out="$(nix build --no-link --print-out-paths .#default)"
        cachix push {{.CACHIX_CACHE}} "$out"
        echo "[+] pushed $out to {{.CACHIX_CACHE}}"

  release:patch:
    desc: "Release vX.Y.(Z+1): gate, bump VERSION, signed commit and tag, push to GitLab and GitHub (CI then pushes to Cachix)"
    cmds:
      - task: release
        vars: { PART: patch }

  release:minor:
    desc: "Release vX.(Y+1).0: same steps as release:patch"
    cmds:
      - task: release
        vars: { PART: minor }

  release:major:
    desc: "Release v(X+1).0.0: same steps as release:patch"
    cmds:
      - task: release
        vars: { PART: major }

  release:current:
    desc: Tag the VERSION already committed (no bump), e.g. the first release
    cmds:
      - task: release
        vars: { PART: current }

  release:
    internal: true
    vars:
      NEXT:
        sh: |
          IFS=. read -r major minor patch < VERSION
          case "{{.PART}}" in
            current) echo "$major.$minor.$patch" ;;
            major) echo "$((major + 1)).0.0" ;;
            minor) echo "$major.$((minor + 1)).0" ;;
            patch) echo "$major.$minor.$((patch + 1))" ;;
          esac
    cmds:
      - |
        fail() { echo "[-] $*"; exit 1; }
        grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' VERSION || fail "VERSION is not X.Y.Z"
        [ -n "{{.NEXT}}" ] || fail "unknown release part {{.PART}}"
        [ "$(git rev-parse --abbrev-ref HEAD)" = main ] || fail "not on main"
        [ -z "$(git status --porcelain)" ] || fail "working tree is not clean"
        for r in origin mirror; do
          git fetch --quiet "$r" main --tags
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "$r/main")" ] || fail "main differs from $r/main; pull or push first"
        done
        git rev-parse -q --verify "refs/tags/v{{.NEXT}}" >/dev/null && fail "tag v{{.NEXT}} already exists"
        echo "[*] releasing v{{.NEXT}} (VERSION {{.VERSION}} -> {{.NEXT}})"
      - task: ci
      - |
        if [ "{{.NEXT}}" != "{{.VERSION}}" ]; then
          echo "{{.NEXT}}" > VERSION
          git add VERSION
          git commit -S -q -m "release: v{{.NEXT}}"
        fi
        git tag -s "v{{.NEXT}}" -m "mcp-taskfile v{{.NEXT}}"
        git verify-tag "v{{.NEXT}}" >/dev/null 2>&1 || { echo "[-] tag v{{.NEXT}} is not validly signed"; exit 1; }
        for r in origin mirror; do
          git push --atomic --quiet "$r" main "refs/tags/v{{.NEXT}}"
          echo "[+] pushed main and v{{.NEXT}} to $r"
        done

  clean:
    desc: Remove local build artifacts (Go binary, coverage, Nix symlinks)
    cmds:
      - rm -f mcp-taskfile {{.COVER_PROFILE}}
      - rm -rf result result-*
